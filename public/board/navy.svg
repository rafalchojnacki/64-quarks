<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 8 8" width="640" height="640">
<defs>
  <filter id="slate" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="1.6 1.1" numOctaves="4" seed="7" result="n"/>
    <feColorMatrix in="n" type="luminanceToAlpha" result="a"/>
    <feFlood flood-color="#2c4a62" flood-opacity="1" result="c"/>
    <feComposite operator="in" in="c" in2="a" result="grain"/>
    <feComposite operator="in" in="grain" in2="SourceGraphic" result="m"/>
    <feBlend in="SourceGraphic" in2="m" mode="soft-light"/>
  </filter>
  <radialGradient id="soft" cx="0.5" cy="0.42" r="0.75">
    <stop offset="0" stop-color="#fff" stop-opacity="0.08"/>
    <stop offset="1" stop-color="#000" stop-opacity="0.12"/>
  </radialGradient>
</defs>
<g filter="url(#slate)">
